# Builds the site with site/build.py and publishes site/docs to GitHub Pages on every push to main.
# One-time setup in the GitHub repo: Settings -> Pages -> "Build and deployment" -> Source = "GitHub Actions".
# Custom domain: Settings -> Pages -> Custom domain = smartselectlabs.com (build.py also writes the CNAME file).
name: Build and deploy smartselectlabs.com

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build dependencies
        run: pip install markdown jinja2 pillow pyyaml
      - name: Build the site
        run: python site/build.py
      - name: Sanity check
        run: |
          test -f site/docs/index.html
          test -f site/docs/sitemap.xml
          echo "pages built:" && find site/docs -name index.html | wc -l
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
