# Pages CMS configuration for smartselectlabs.com  (https://pagescms.org)
# ---------------------------------------------------------------------------------------------------------
# Mom's posting screen. She signs in at app.pagescms.org with her email (no GitHub account needed once Lewis
# has invited her). The left menu shows one entry per kind of post; each "Add" button opens a form with the
# right starter text already in the body. Saving writes a Markdown file into this repository; the GitHub Action
# in .github/workflows/build.yml rebuilds and publishes the site about a minute later.
#
# Templates = folders: content/posts/reviews, guides, checklists, stories (+ imported = the old Hostinger posts).
# site/build.py reads all of them; the web address of a post is just its file name (/best-pickleball-shoes-for-women/).
# Field names match what site/build.py reads from each post's front matter.
# ---------------------------------------------------------------------------------------------------------

media:
  input: content/images
  output: /images

content:
  - name: reviews
    label: "Gear reviews"
    description: "Paddles, shoes, bottles, outfits, skincare: the posts that earn. Starter text already has the money boxes."
    type: collection
    path: content/posts/reviews
    filename: "{primary}.md"
    format: yaml-frontmatter
    view:
      primary: title
      sort: date
      order: desc
      search: true
      fields: [title, category, date, draft]
    fields:
      - name: title
        label: Title
        type: string
        required: true
        description: "What it is and who it is for. Example: Best Pickleball Shoes for Women: Nike, On, ASICS & New Balance"
      - name: date
        label: Date
        type: date
        description: "Today's date. Newest posts show first."
      - name: category
        label: Section of the site
        type: select
        required: true
        default: "Gear Reviews"
        options:
          values: ["Beginner Guides", "Gear Reviews", "Health & Recovery"]
      - name: description
        label: Short summary
        type: text
        description: "One or two sentences, about 150 characters. Shows under the title and in Google."
      - name: image
        label: Main picture
        type: image
        description: "The big picture at the top. Your own photo is best. Wider than tall."
      - name: image_alt
        label: What is in the picture?
        type: string
        description: "A plain sentence for people who cannot see it and for Google."
      - name: keyphrase
        label: Search phrase (optional)
        type: string
        description: "The words someone types into Google to find this post, e.g. best pickleball shoes for women. Lewis can fill this in."
      - name: affiliate
        label: This post has shopping links
        type: boolean
        default: true
      - name: draft
        label: Keep as a draft (not public yet)
        type: boolean
        default: true
        description: "Leave ON while writing. Turn OFF to publish. You can turn it back on any time."
      - name: body
        label: Post
        type: rich-text
        options:
          format: markdown
          media:
            path: content/images/posts
            extensions: [jpg, jpeg, png, webp]
            rename: safe
        default: |
          Who this is for, in one or two sentences, then the short answer and one reason. (Replace this paragraph.)

          ```quick
          **The short answer:** one or two sentences a reader could act on without reading further.
          ```

          ```picks
          Best overall | Product name | one line on why | https://brand-store-link | Brand
          Best value | Product name | one line on why | https://www.amazon.com/s?k=search+words&tag=smartselec0a7-20 | Amazon
          Best for sore knees | Product name | one line on why | https://brand-store-link | Brand
          ```

          ## What matters when you choose

          Three or four short paragraphs. Numbers beat adjectives: weight, width, SPF, ounces, how many sessions.

          ## Side by side

          ```compare
          Product | Weight | Best for | Amazon
          Product one | 7.8 oz | Most beginners | https://www.amazon.com/s?k=product+one&tag=smartselec0a7-20
          Product two | 7.6 oz | Sore elbows | https://www.amazon.com/s?k=product+two&tag=smartselec0a7-20
          ```

          ### Product one: best overall

          Two or three short paragraphs on who it suits and why. Say who should skip it.

          ```buyif
          + you want ...
          + you play ...
          - you already have ...
          - you want to spend under ...
          ```

          ```cta
          See it on Amazon | https://www.amazon.com/s?k=product+one&tag=smartselec0a7-20 | Amazon
          ```

          ## What to skip

          One short paragraph.

          ## How we chose

          Two or three honest sentences. Say what you used yourself and what rests on specs and other players.

          ```faq
          Q: A real question people ask at open play?
          A: A two or three sentence answer.
          Q: Another real question?
          A: Answer.
          ```

          ```verdict
          - | Our verdict
          Two or three sentences. Which one to buy, and for whom.
          ```

