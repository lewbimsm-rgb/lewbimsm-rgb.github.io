- name: story
  label: Story & weekly diary
  description: A morning at open play, something you learned this week, a tournament. Just write.
  type: collection
  path: content/posts/stories
  subfolders: false
  filename: '{primary}.md'
  format: yaml-frontmatter
  exclude:
  - .gitkeep
  view:
    primary: title
    fields:
    - title
    - category
    - date
    - draft
    sort:
    - date
    - title
    search:
    - title
    - description
    default:
      sort: date
      order: desc
  fields:
  - name: title
    label: Title
    type: string
    required: true
    description: 'Example: What a Windy Morning at Sunset Park Taught Me About the Third Shot'
  - name: date
    label: Date
    type: date
    description: Today's date. Newest posts show first.
  - name: category
    label: Section of the site
    type: select
    required: true
    default: Health & Recovery
    options:
      values:
      - Beginner Guides
      - Gear Reviews
      - Health & Recovery
  - name: description
    label: Short summary
    type: text
    description: One or two sentences, about 150 characters. Shows under the title and in Google. Leave empty and the site uses your first paragraph.
  - name: image
    label: Main picture
    type: image
    description: The big picture at the top. Your own photo is best, wider than tall. Leave empty and the site uses a court photo.
  - name: image_alt
    label: What is in the picture?
    type: string
    description: A plain sentence for people who cannot see it, and for Google.
  - name: keyphrase
    label: Search phrase (optional)
    type: string
    description: The words someone types into Google to find this post, e.g. best pickleball shoes for women. Lewis can fill this in.
  - name: affiliate
    label: This post has shopping links
    type: boolean
    default: false
  - name: draft
    label: Keep as a draft (not public yet)
    type: boolean
    default: true
    description: Leave ON while writing. Turn OFF and press Save to publish. Turn it back ON any time to hide the post.
  - name: body
    label: Post
    type: rich-text
    options:
      format: markdown
      media:
        path: content/images/posts
        extensions:
        - jpg
        - jpeg
        - png
        - webp
        rename: safe
