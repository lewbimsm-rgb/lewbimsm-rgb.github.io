# Pages CMS configuration for smartselectlabs.com: Mom's writing desk (https://app.pagescms.org).
# GENERATED by tools/make_pages_config.py. Edit the template library there and re-run; do not edit this file by hand.
# Menu: All my posts (every folder) / eight templates (each opens a new post with its outline) / Pages / Media.
media:
  input: content/images
  output: /images
content:
- name: all_posts
  label: All my posts
  description: Every post in one place. Open any folder, search, see which are drafts, edit, publish or delete. To start a new post, pick a template below.
  type: collection
  path: content/posts
  subfolders: true
  filename: '{primary}.md'
  format: yaml-frontmatter
  exclude:
  - .gitkeep
  view:
    primary: title
    fields:
    - title
    - category
    - date
    - draft
    sort:
    - date
    - title
    search:
    - title
    - description
    default:
      sort: date
      order: desc
  fields:
  - name: title
    label: Title
    type: string
    required: true
    description: The headline readers and Google see.
  - name: date
    label: Date
    type: date
    description: Today's date. Newest posts show first.
  - name: category
    label: Section of the site
    type: select
    required: true
    default: Beginner Guides
    options:
      values:
      - Beginner Guides
      - Gear Reviews
      - Health & Recovery
  - name: description
    label: Short summary
    type: text
    description: One or two sentences, about 150 characters. Shows under the title and in Google. Leave empty and the site uses your first paragraph.
  - name: image
    label: Main picture
    type: image
    description: The big picture at the top. Your own photo is best, wider than tall. Leave empty and the site uses a court photo.
  - name: image_alt
    label: What is in the picture?
    type: string
    description: A plain sentence for people who cannot see it, and for Google.
  - name: keyphrase
    label: Search phrase (optional)
    type: string
    description: The words someone types into Google to find this post, e.g. best pickleball shoes for women. Lewis can fill this in.
  - name: affiliate
    label: This post has shopping links
    type: boolean
    default: false
  - name: draft
    label: Keep as a draft (not public yet)
    type: boolean
    default: true
    description: Leave ON while writing. Turn OFF and press Save to publish. Turn it back ON any time to hide the post.
  - name: body
    label: Post
    type: rich-text
    options:
      format: markdown
      media:
        path: content/images/posts
        extensions:
        - jpg
        - jpeg
        - png
        - webp
        rename: safe
